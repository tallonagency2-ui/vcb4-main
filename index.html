<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f7fbfa">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <meta name="robots" content="noindex, nofollow">

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iPhone / iPad -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="VCB Digibank"
    >

    <!-- Icon màn hình chính iPhone -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./img/vcb-ios-icon-full-v8.png"
>

    <title>VCB Digibank</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./css/index.css?v=6"
    >

    <!-- JavaScript -->
    <script
        src="./js/index.js?v=6"
        defer
    ></script>
</head>

<body>
    <main
        class="splash-screen"
        id="splashPage"
        aria-label="Màn hình chào VCB Digibank"
    >
        <section class="splash-content">
            <img
                src="./img/vcb-digibank-logo.png"
                class="splash-logo"
                alt="VCB Digibank"
                draggable="false"
            >
        </section>
    </main>

    <noscript>
        <p>Vui lòng bật JavaScript để sử dụng VCB Digibank.</p>
    </noscript>
</body>
</html>
