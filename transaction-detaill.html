
<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#125046">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VCB Digibank">

    <title>Chi tiết giao dịch</title>

    <link rel="stylesheet" href="./css/transaction-detaill.css">
    <script src="./js/transaction-detaill.js" defer></script>
</head>

<body>
    <img
        class="detail-background-img"
        src="./img/transaction-history-bg.png"
        alt=""
        draggable="false"
    >

    <main class="detail-app">
        <header class="detail-header">
            <button
                class="detail-icon-button detail-back-button"
                id="detailBackButton"
                type="button"
                aria-label="Quay lại"
            >
                <img
                    class="detail-back-img"
                    src="./img/history-back.png"
                    alt=""
                    draggable="false"
                >
            </button>

            <h1>Chi tiết giao dịch</h1>

            <button
                class="detail-icon-button detail-home-button"
                id="detailHomeButton"
                type="button"
                aria-label="Về trang chủ"
            >
                <img
                    class="detail-home-img"
                    src="./img/detail-home.png"
                    alt=""
                    draggable="false"
                >
            </button>
        </header>

        <section class="detail-information" aria-label="Thông tin giao dịch">
            <div class="detail-row">
                <span class="detail-label">Mã giao dịch</span>
                <strong class="detail-value" id="transactionCode">5254 - 35233</strong>
            </div>

            <div class="detail-row">
                <span class="detail-label">Ngày giao dịch</span>
                <strong class="detail-value" id="transactionDate">31/07/2026</strong>
            </div>

            <div class="detail-row detail-amount-row">
                <span class="detail-label">Số tiền thanh toán</span>

                <strong class="detail-value detail-amount" id="transactionAmount">
                    <span id="transactionAmountValue">1,500,000</span>
                    <small>VND</small>
                </strong>
            </div>

            <div class="detail-row detail-content-row">
                <span class="detail-label">Nội dung giao dịch</span>

                <strong class="detail-value detail-content" id="transactionContent">
                    UHHT..393319..20260729.<wbr>.452404...1539.20260730.<wbr>DG:FACEBK
                    <wbr>*H2ZH8W5822 <wbr>Dubli.1,500,00.00VND
                </strong>
            </div>
        </section>
    </main>
</body>
</html>
